<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us – Velvet Vogue</title>
  <link rel="stylesheet" href="contact.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <img src="icon.png" alt="Velvet Vogue Icon" class="nav-icon" />
      <span class="brand-name">Velvet Vogue</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="faq.html">FAQ</a></li>
      <li><a href="cart.html" class="nav-cart">🛒 Cart</a></li>
      <li><a href="login.html" class="nav-login">Login</a></li>
    </ul>
  </nav>

  <main class="contact-wrapper">
    <div class="contact-container">
      <h1 class="page-heading">Contact Us</h1>
      
      <form class="contact-form" action="#" method="POST">
        <div class="form-group">
          <input type="text" id="name" name="name" placeholder="Your Name" required />
        </div>
        
        <div class="form-group">
          <input type="email" id="email" name="email" placeholder="Your Email" required />
        </div>
        
        <div class="form-group">
          <textarea id="message" name="message" rows="6" placeholder="Your Message" required></textarea>
        </div>
        
        <button type="submit" class="btn-submit">Send Message</button>
      </form>

      <div class="contact-info">
        <p>Email: support@velvetvogue.com &nbsp;|&nbsp; Location: Kandy, Sri Lanka</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="icon.png" alt="Velvet Vogue Icon" class="footer-icon" />
        <span>Velvet Vogue</span>
      </div>
      <div class="footer-links">
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
      </div>
      <p class="footer-copy">&copy; 2024 Velvet Vogue. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
